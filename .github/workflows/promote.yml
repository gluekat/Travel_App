# One click to publish the current development version as the new stable
# version: Actions → "Promote dev to stable" → Run workflow.
# Fast-forwards `release` to the latest commit of the default branch (it never
# rewrites or discards history), then redeploys the site.
name: Promote dev to stable

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fast-forward release to the dev branch
        run: |
          git fetch origin release
          if ! git merge-base --is-ancestor origin/release HEAD; then
            echo "::error::The release branch has commits that aren't on the development branch, so it can't be fast-forwarded. Merge release into the development branch first."
            exit 1
          fi
          echo "Promoting $(git rev-parse --short origin/release) → $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git log --oneline origin/release..HEAD >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:release
      - name: Redeploy the site
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
