# When the `release` branch changes, redeploy the Pages site. The deploy
# itself runs from the default branch (which the github-pages environment
# allows) and builds `release` as the stable version.
name: Release changed → redeploy

on:
  push:
    branches: [release]

permissions:
  actions: write

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
